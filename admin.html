<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | فكرة للدعاية والإعلان</title>
    <link rel="stylesheet" href="assets/styles/style.css">
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card-panel { background: #1e1e1e; padding: 25px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
        input, textarea, select { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 5px; box-sizing: border-box; }
        .btn { background: #00bcd4; color: #fff; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-danger { background: #ff4444; }
        .btn-warning { background: #ffbb33; color: #000; }
        .btn-secondary { background: #555; text-decoration: none; display: inline-block; text-align: center; line-height: 35px; }
        .hidden { display: none; }
        .product-admin-item { display: flex; align-items: center; justify-content: space-between; background: #2a2a2a; padding: 12px; margin-bottom: 10px; border-radius: 6px; }
        .product-admin-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .actions { display: flex; gap: 8px; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- قسم تسجيل الدخول -->
        <div id="login-section" class="card-panel">
            <h2>تسجيل دخول الأدمن</h2>
            <input type="email" id="admin-email" placeholder="البريد الإلكتروني">
            <input type="password" id="admin-password" placeholder="كلمة المرور">
            <button id="login-btn" class="btn">دخول</button>
            <p id="login-error" style="color:red; margin-top:10px;"></p>
        </div>

        <!-- قسم لوحة التحكم -->
        <div id="dashboard-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>لوحة إدارة المنتجات</h2>
                <div>
                    <a href="index.html" target="_blank" class="btn btn-secondary" style="width: auto; padding: 0 15px;">معاينة الموقع ↗</a>
                    <button id="logout-btn" class="btn btn-danger" style="width: auto; margin-top: 0;">خروج</button>
                </div>
            </div>

            <!-- نموذج إضافة / تعديل منتج -->
            <div class="card-panel">
                <h3 id="form-title" style="color:#00bcd4;">إضافة منتج جديد</h3>
                <input type="hidden" id="edit-doc-id">
                
                <label>اسم المنتج/الخدمة:</label>
                <input type="text" id="prod-name" placeholder="مثال: كروت شخصية فاخرة">

                <label>السعر (جنيه):</label>
                <input type="number" id="prod-price" placeholder="مثال: 250">

                <label>القسم:</label>
                <input type="text" id="prod-category" placeholder="مثال: مطبوعات ورقية">

                <label>مسار/رابط الصورة:</label>
                <input type="text" id="prod-image" placeholder="مثال: assets/images/cards.png">

                <label>وصف المنتج التفصيلي:</label>
                <textarea id="prod-desc" rows="3" placeholder="اكتب تفاصيل ومواصفات المنتج هنا..."></textarea>

                <label>خيارات القائمة المنسدلة (افصل بين الخيارات بفاصلة ,):</label>
                <input type="text" id="prod-options" placeholder="مثال: مقاس A4, مقاس A3, مقاس A2">

                <button id="save-product-btn" class="btn">حفظ ورفع المنتج</button>
                <button id="cancel-edit-btn" class="btn btn-warning hidden">إلغاء التعديل</button>
                <p id="add-msg" style="margin-top:10px;"></p>
            </div>

            <!-- قائمة المنتجات الحالية -->
            <div class="card-panel">
                <h3>المنتجات المعروضة حالياً</h3>
                <div id="admin-products-list">جاري تحميل المنتجات...</div>
            </div>
        </div>

    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
