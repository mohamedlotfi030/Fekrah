<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>سلة المشتريات | فكرة</title>
  <link rel="stylesheet" href="assets/styles/style.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; }
    .navbar { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 15px 30px; border-bottom: 2px solid #333; }
    .container { max-width: 900px; margin: 40px auto; padding: 20px; background: #1e1e1e; border-radius: 12px; }
    .cart-item { display: flex; align-items: center; justify-content: space-between; background: #2a2a2a; margin-bottom: 15px; padding: 15px; border-radius: 8px; }
    .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #444; }
    .cart-info { flex: 1; margin-right: 15px; }
    .cart-actions button { margin-left: 10px; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-remove { background: #ff4757; color: #fff; }
    .btn-checkout { background: #25d366; color: #fff; }
    .btn-clear { background: #d44638; color: #fff; }
  </style>
</head>
<body>
  <!-- شريط التنقل -->
  <nav class="navbar">
    <a href="index.html" style="color:#00bcd4; text-decoration:none; font-weight:bold;">➔ العودة للرئيسية</a>
    <h2>🛒 سلة المشتريات</h2>
  </nav>

  <!-- محتوى السلة -->
  <div class="container">
    <div id="cart-list"></div>
    <div style="margin-top:20px; text-align:center;">
      <button id="btn-clear" class="btn-clear">مسح السلة بالكامل</button>
      <button id="btn-checkout" class="btn-checkout">تأكيد الطلب عبر الواتساب</button>
    </div>
  </div>

  <script type="module">
    import { Cart } from './js/cart.js';

    // عند تحميل الصفحة
    document.addEventListener('DOMContentLoaded', async () => {
      await Cart.init();
      renderCart();
    });

    // عرض السلة
    function renderCart() {
      const cartList = document.getElementById('cart-list');
      cartList.innerHTML = '';

      if (Cart.items.length === 0) {
        cartList.innerHTML = '<p style="text-align:center; color:#bbb;">السلة فارغة حالياً.</p>';
        return;
      }

      Cart.items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <div class="cart-info">
            <h3>${item.name}</h3>
            <p>المواصفات: ${item.option || 'عادي'} | المقاس: ${item.size || 'قياسي'}</p>
          </div>
          <div class="cart-actions">
            <button class="btn-remove" data-index="${index}">حذف</button>
          </div>
        `;
        cartList.appendChild(div);
      });

      // ربط أزرار الحذف
      document.querySelectorAll('.btn-remove').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const index = e.target.dataset.index;
          await Cart.remove(index);
          renderCart();
        });
      });
    }

    // زر مسح السلة
    document.getElementById('btn-clear').addEventListener('click', async () => {
      await Cart.clear();
      renderCart();
    });

    // زر تأكيد الطلب عبر واتساب
    document.getElementById('btn-checkout').addEventListener('click', () => {
      if (Cart.items.length === 0) {
        alert("السلة فارغة!");
        return;
      }
      let msg = "مرحباً، أريد تأكيد الطلب:\n";
      Cart.items.forEach(item => {
        msg += `• ${item.name} | ${item.size} | ${item.option}\n`;
      });
      window.open(`https://wa.me/201111049778?text=${encodeURIComponent(msg)}`, '_blank');
    });
  </script>
</body>
</html>
