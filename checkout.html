<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="إتمام الطلب - فكرة للدعاية والإعلان">
    <title>إتمام الطلب | فكرة للدعاية والإعلان</title>
    
    <link rel="icon" type="image/png" href="logo-main.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/styles/style.css">
    
    <style>
        /* التنسيقات العامة والموحدة */
        .logo img { height: 45px; width: auto; display: block; }
        
        body { background-color: #f5f5f5; }
        
        /* تنسيق شبكة إتمام الطلب */
        .checkout-wrapper {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
        }
        
        @media(max-width: 768px) {
            .checkout-wrapper { grid-template-columns: 1fr; }
        }
        
        .checkout-box {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        .checkout-box h2 {
            color: #00bcd4;
            margin-bottom: 25px;
            font-size: 1.5rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        
        /* تنسيق نموذج البيانات */
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 1rem;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #00bcd4;
        }
        
        /* ملخص الطلب */
        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .summary-item:last-child { border-bottom: none; }
        .summary-item h4 { margin: 0; color: #333; }
        .summary-item span { color: #00bcd4; font-weight: bold; }
        
        .btn-confirm {
            background: #25d366; /* لون واتساب */
            color: #fff;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-confirm:hover { background: #20b858; }
        
        .empty-cart-msg {
            text-align: center;
            color: #ff4444;
            font-weight: bold;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- الهيدر الموحد -->
    <header class="header">
        <div class="logo">
            <a href="index.html">
                <img src="logo-main.png" alt="فكرة للدعاية والإعلان">
            </a>
        </div>
        <nav class="nav-group">
            <a href="index.html" class="nav-link">
                <i class="fas fa-home"></i>
                <span>الرئيسية</span>
            </a>
            <a href="gallery.html" class="nav-link">
                <i class="fas fa-camera"></i>
                <span>سابقة الأعمال</span>
            </a>
            <a href="index.html#contact-section" class="nav-link">
                <i class="fas fa-address-book"></i>
                <span>تواصل معنا</span>
            </a>
        </nav>
    </header>

    <!-- محتوى صفحة إتمام الطلب -->
    <div class="checkout-wrapper">
        
        <!-- قسم بيانات العميل -->
        <div class="checkout-box">
            <h2><i class="fas fa-user-edit"></i> بيانات التواصل والشحن</h2>
            <form id="checkoutForm">
                <div class="form-group">
                    <label>الاسم / اسم الشركة *</label>
                    <input type="text" id="customerName" required placeholder="مثال: شركة النور أو أحمد محمد">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف (للتواصل واتساب) *</label>
                    <input type="tel" id="customerPhone" required placeholder="01xxxxxxxxx">
                </div>
                <div class="form-group">
                    <label>العنوان بالتفصيل *</label>
                    <input type="text" id="customerAddress" required placeholder="المدينة، المنطقة، الشارع، رقم المبنى">
                </div>
                <div class="form-group">
                    <label>ملاحظات إضافية على الطلب (اختياري)</label>
                    <textarea id="orderNotes" rows="3" placeholder="أي تفاصيل خاصة بالمقاسات أو الألوان..."></textarea>
                </div>
                
                <button type="submit" class="btn-confirm" id="submitBtn">
                    <i class="fab fa-whatsapp"></i> تأكيد وإرسال الطلب عبر واتساب
                </button>
            </form>
        </div>

        <!-- قسم ملخص الطلب -->
        <div class="checkout-box">
            <h2><i class="fas fa-clipboard-list"></i> ملخص الطلب</h2>
            <div id="orderSummaryContent">
                <!-- سيتم حقن المنتجات هنا بواسطة الجافاسكريبت -->
            </div>
        </div>

    </div>

    <!-- الفوتر الموحد -->
    <footer style="padding:20px; text-align:center; background:#0a0a0a; color:#888; border-top: 1px solid #222; margin-top: 50px;">
      © جميع الحقوق محفوظة لدى فكرة للدعاية والإعلان 2026
    </footer>

    <!-- ملفات الجافاسكريبت الأساسية -->
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderOrderSummary();

            // التعامل مع إرسال النموذج
            document.getElementById('checkoutForm').addEventListener('submit', function(e) {
                e.preventDefault(); // منع إعادة تحميل الصفحة
                sendOrderViaWhatsApp();
            });
        });

        // دالة لعرض المنتجات الموجودة في السلة
        function renderOrderSummary() {
            const summaryContainer = document.getElementById('orderSummaryContent');
            const submitBtn = document.getElementById('submitBtn');
            
            // جلب البيانات من السلة (Local Storage)
            let cartItems = [];
            try {
                cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
            } catch(e) {
                cartItems = [];
            }

            if (cartItems.length === 0) {
                summaryContainer.innerHTML = '<div class="empty-cart-msg">السلة فارغة. يرجى إضافة منتجات أولاً!</div>';
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.5';
                submitBtn.style.cursor = 'not-allowed';
                return;
            }

            let html = '';
            cartItems.forEach(item => {
                // جلب اسم المنتج من ملف products.js إذا كان موجوداً
                const productName = (typeof Products !== 'undefined' && Products[item.type]) ? Products[item.type].name : item.type;
                
                html += `
                    <div class="summary-item">
                        <h4>${productName}</h4>
                        <span>الكمية: ${item.quantity}</span>
                    </div>
                `;
            });
            summaryContainer.innerHTML = html;
        }

        // دالة تجميع البيانات وإرسالها لواتساب الشركة
        function sendOrderViaWhatsApp() {
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            const address = document.getElementById('customerAddress').value;
            const notes = document.getElementById('orderNotes').value;
            
            let cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
            
            // رقم واتساب الشركة (تأكد من تعديله إذا لزم الأمر، أضف رمز الدولة بدون +)
            const companyWhatsAppNumber = "201111049778"; 

            let message = `*طلب جديد من موقع فكرة* 💡\n\n`;
            message += `*بيانات العميل:*\n`;
            message += `- الاسم: ${name}\n`;
            message += `- الهاتف: ${phone}\n`;
            message += `- العنوان: ${address}\n`;
            if(notes) message += `- ملاحظات: ${notes}\n`;
            
            message += `\n*المنتجات المطلوبة:*\n`;
            cartItems.forEach((item, index) => {
                const productName = (typeof Products !== 'undefined' && Products[item.type]) ? Products[item.type].name : item.type;
                message += `${index + 1}. ${productName} (الكمية: ${item.quantity})\n`;
            });

            // تحويل النص لرابط متوافق مع واتساب
            const whatsappUrl = `https://wa.me/${companyWhatsAppNumber}?text=${encodeURIComponent(message)}`;
            
            // فتح واتساب وإفراغ السلة
            localStorage.removeItem('cartItems');
            window.location.href = whatsappUrl;
        }
    </script>
</body>
</html>
