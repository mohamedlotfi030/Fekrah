<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تفاصيل الخدمة أو المنتج - فكرة للدعاية والإعلان.">
    <title>تفاصيل المنتج | فكرة للدعاية والإعلان</title>
    
    <link rel="icon" type="image/png" href="logo-main.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/styles/style.css">
    
    <style>
        /* تنسيقات الهيدر */
        .logo img { height: 45px; width: auto; display: block; }
        
        /* التنسيق الداكن والفخم لصفحة التفاصيل */
        body {
            background-color: #050505;
        }
        .product-details {
            padding: 50px 5%;
            background: #0a0a0a;
            color: #fff;
        }
        .product-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            background: #111;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #222;
        }
        .product-images {
            flex: 1;
            min-width: 300px;
        }
        #mainImage {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 15px;
        }
        .thumbnails {
            display: flex;
            gap: 10px;
        }
        .thumbnail {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
            opacity: 0.7;
        }
        .thumbnail:hover, .thumbnail.active {
            border-color: #00bcd4;
            opacity: 1;
        }
        
        .product-info {
            flex: 1;
            min-width: 300px;
        }
        .product-info h1 {
            color: #00bcd4;
            margin-bottom: 15px;
            font-size: 2rem;
        }
        .product-desc {
            color: #aaa;
            line-height: 1.8;
            margin-bottom: 25px;
        }
        .order-form {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ddd;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #00bcd4;
        }
        .btn-add-cart {
            width: 100%;
            padding: 12px;
            background: #00bcd4;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-add-cart:hover {
            background: #008ba3;
            color: #fff;
        }

        /* =========================================
           كود تغيير اللون من الأسود إلى الأبيض
        ========================================= */
        body.white-mode, 
        body.white-mode section, 
        body.white-mode header, 
        body.white-mode footer, 
        body.white-mode .product-details,
        body.white-mode .product-container,
        body.white-mode .order-form,
        body.white-mode .cart-drawer {
            background-color: #ffffff !important;
            color: #000000 !important;
            border-color: #dddddd !important;
        }
        body.white-mode .product-desc,
        body.white-mode .product-desc p,
        body.white-mode .product-desc li,
        body.white-mode label,
        body.white-mode span, 
        body.white-mode .nav-link,
        body.white-mode .drawer-header h3 {
            color: #000000 !important;
        }
        body.white-mode .form-group input,
        body.white-mode .form-group select {
            background-color: #f9f9f9 !important;
            color: #000000 !important;
            border-color: #cccccc !important;
        }
    </style>
</head>
<body>

    <div id="cartOverlay" class="cart-overlay" onclick="UI.toggleCart(false)"></div>

    <header class="header">
        <div class="logo">
            <a href="index.html">
                <img src="logo-main.png" alt="فكرة للدعاية والإعلان">
            </a>
        </div>
        <nav class="nav-group">
            <a href="index.html" class="nav-link">
                <i class="fas fa-home"></i>
                <span>الرئيسية</span>
            </a>
            <a href="gallery.html" class="nav-link">
                <i class="fas fa-camera"></i>
                <span>سابقة الأعمال</span>
            </a>
            <a href="index.html#contact-section" class="nav-link">
                <i class="fas fa-address-book"></i>
                <span>تواصل معنا</span>
            </a>
            <!-- زر تغيير اللون -->
            <a onclick="toggleColor()" class="nav-link" style="cursor:pointer; color: #00bcd4;">
                <i class="fas fa-adjust"></i>
                <span>تغيير اللون</span>
            </a>
            <div onclick="UI.toggleCart(true)" style="cursor:pointer; position:relative;" class="nav-link">
                <i class="fas fa-shopping-cart"></i>
                <span id="cartBadge" class="cart-badge" style="display:none;">0</span>
                <span>السلة</span>
            </div>
        </nav>
    </header>

    <section class="product-details">
        <div class="product-container" id="productContainer">
            <!-- سيتم حقن المحتوى هنا بواسطة JS -->
        </div>
    </section>

    <div id="cartDrawer" class="cart-drawer">
        <div class="drawer-header">
            <h3 style="margin:0; color:#fff;">سلة الطلبات</h3>
            <span onclick="UI.toggleCart(false)" style="cursor:pointer; color:#fff; font-size: 2.5rem;">×</span>
        </div>
        <div id="cartItemsList" style="padding: 15px; overflow-y: auto; flex: 1;">
        </div>
        <div style="padding: 20px; border-top: 1px solid #333;">
            <button onclick="window.location.href='checkout.html'" class="btn-main" style="width: 100%; margin:0;">إتمام الطلب</button>
        </div>
    </div>

    <footer style="padding:20px; text-align:center; background:#0a0a0a; color:#888; border-top: 1px solid #222;">
      © جميع الحقوق محفوظة لدى فكرة للدعاية والإعلان 2026
    </footer>

    <script src="js/products.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/api.js"></script>

    <script>
        function toggleColor() {
            document.body.classList.toggle('white-mode');
            if (document.body.classList.contains('white-mode')) {
                localStorage.setItem('siteColor', 'white');
            } else {
                localStorage.setItem('siteColor', 'black');
            }
        }

        if (localStorage.getItem('siteColor') === 'white') {
            document.body.classList.add('white-mode');
        }

        document.addEventListener('DOMContentLoaded', () => {
            if(typeof Cart !== 'undefined') Cart.init();

            const urlParams = new URLSearchParams(window.location.search);
            const productType = urlParams.get('type');
            const container = document.getElementById('productContainer');

            if (productType && typeof Products !== 'undefined' && Products[productType]) {
                const product = Products[productType];
                
                let thumbnailsHTML = '';
                product.images.forEach((img, index) => {
                    thumbnailsHTML += `<img src="${img}" class="thumbnail ${index === 0 ? 'active' : ''}" onclick="changeMainImage(this, '${img}')">`;
                });

                container.innerHTML = `
                    <div class="product-images">
                        <img id="mainImage" src="${product.images[0]}" alt="${product.name}">
                        <div class="thumbnails">
                            ${thumbnailsHTML}
                        </div>
                    </div>
                    
                    <div class="product-info">
                        <h1>${product.name}</h1>
                        <div class="product-desc">
                            <p>${product.description || 'نقدم لكم أعلى معايير الجودة في الطباعة والتنفيذ لضمان أفضل نتيجة لعلامتكم التجارية.'}</p>
                            <ul style="padding-right: 20px; margin-top: 10px;">
                                <li>جودة تنفيذ عالية بخامات ممتازة</li>
                                <li>أسعار تنافسية تناسب ميزانيتك</li>
                                <li>التزام تام بمواعيد التسليم</li>
                            </ul>
                        </div>
                        
                        <div class="order-form">
                            <div class="form-group">
                                <label>الكمية المطلوبة:</label>
                                <input type="number" id="qty" value="1" min="1">
                            </div>
                            <button class="btn-add-cart" onclick="addToCartAndNotify('${productType}')">
                                <i class="fas fa-cart-plus"></i> أضف إلى السلة
                            </button>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `<h2 style="text-align:center; width:100%; color:#ff4444;">عذراً، المنتج غير موجود.</h2>`;
            }
        });

        function changeMainImage(element, src) {
            document.getElementById('mainImage').src = src;
            document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
        }

        function addToCartAndNotify(type) {
            const qty = parseInt(document.getElementById('qty').value) || 1;
            if(typeof Cart !== 'undefined') {
                Cart.addItem(type, qty);
                UI.toggleCart(true); 
            } else {
                alert('حدث خطأ في السلة، يرجى المحاولة لاحقاً.');
            }
        }
    </script>
</body>
</html>
