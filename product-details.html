<script type="module">
    import { db } from './js/firebase-config.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        if (productId) {
            try {
                const docRef = doc(db, "products", productId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const product = docSnap.data();

                    // تحديث عناصر الصفحة بالبيانات الديناميكية
                    if(document.getElementById('product-title')) 
                        document.getElementById('product-title').innerText = product.name;
                    
                    if(document.getElementById('product-price')) 
                        document.getElementById('product-price').innerText = product.price + " ج.م";

                    if(document.getElementById('product-image')) 
                        document.getElementById('product-image').src = product.image;

                    if(document.getElementById('product-desc')) 
                        document.getElementById('product-desc').innerText = product.description || 'لا يوجد وصف إضافي.';

                    // إنشاء القائمة المنسدلة للخيارات إن وجدت
                    const optionsContainer = document.getElementById('product-options-select');
                    if (optionsContainer && product.options && product.options.length > 0) {
                        optionsContainer.innerHTML = '';
                        product.options.forEach(opt => {
                            const option = document.createElement('option');
                            option.value = opt;
                            option.innerText = opt;
                            optionsContainer.appendChild(option);
                        });
                    }
                }
            } catch (error) {
                console.error("خطأ في تحميل تفاصيل المنتج:", error);
            }
        }
    });
</script>
