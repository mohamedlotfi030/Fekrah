<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج | فكرة</title>
  <link rel="stylesheet" href="assets/styles/style.css">
  <style>
    /* احتفظ بالأنماط التي لديك أو ألصق الأنماط السابقة */
  </style>
</head>
<body>
  <!-- شريط التنقل -->
  <nav class="navbar">
    <a href="index.html" class="btn-back">➔ العودة للرئيسية</a>
    <div class="cart-icon-container" id="cart-icon">🛒 <span class="cart-badge" id="cart-count">0</span></div>
  </nav>

  <div class="container">
    <div id="loading-state" class="loading-msg">جاري تحميل بيانات المنتج... ⏳</div>

    <div id="product-content" class="product-wrapper" style="display: none;">
      <div class="product-media">
        <img id="product-image" src="" alt="صورة المنتج">
      </div>

      <div class="product-info">
        <h1 id="product-title">--</h1>
        <div id="product-price" class="product-price">-- ج.م</div>
        <p id="product-desc" style="color: #bbb; line-height: 1.6;">--</p>

        <div id="options-container" style="display: none; margin: 15px 0;">
          <label style="display:block; margin-bottom:8px;">المقاس / المواصفات:</label>
          <select id="product-size" style="width: 100%; padding: 12px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 8px; font-size:1rem;"></select>
          <select id="product-options" style="width: 100%; padding: 12px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 8px; font-size:1rem; margin-top:10px;"></select>
        </div>

        <div class="action-buttons">
          <button id="btn-add-cart" class="btn btn-cart">إضافة إلى السلة 🛒</button>
          <button id="btn-whatsapp" class="btn btn-whatsapp">إتمام الطلب عبر الواتساب 💬</button>
          <button id="btn-email" class="btn btn-email">إتمام الطلب عبر الإيميل ✉️</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from './js/firebase-config.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { addToCart } from './js/cart.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const loadingElem = document.getElementById('loading-state');
      const contentElem = document.getElementById('product-content');

      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      if (!productId || productId === 'undefined') {
        loadingElem.innerHTML = `<h3 style="color:#ff4757;">عذراً، المنتج غير موجود أو الرابط غير صحيح.</h3>`;
        return;
      }

      try {
        const docRef = doc(db, "products", productId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const product = docSnap.data();

          document.getElementById('product-title').innerText = product.name || '--';
          document.getElementById('product-price').innerText = (product.price !== undefined ? product.price : '--') + " ج.م";
          document.getElementById('product-image').src = product.image || 'assets/images/Baner.png';
          document.getElementById('product-desc').innerText = product.description || 'لا يوجد وصف متاح لهذا المنتج.';

          // تهيئة القوائم إن وُجدت
          const optionsContainer = document.getElementById('options-container');
          const sizeSelect = document.getElementById('product-size');
          const optionsSelect = document.getElementById('product-options');

          // مساحات افتراضية إن لم توجد
          sizeSelect.innerHTML = '';
          optionsSelect.innerHTML = '';

          if (product.sizes && Array.isArray(product.sizes) && product.sizes.length > 0) {
            product.sizes.forEach(s => {
              const opt = document.createElement('option');
              opt.value = s; opt.innerText = s;
              sizeSelect.appendChild(opt);
            });
            optionsContainer.style.display = 'block';
          } else {
            // إخفاء select المقاسات إذا لم توجد
            sizeSelect.style.display = 'none';
          }

          if (product.options && Array.isArray(product.options) && product.options.length > 0) {
            product.options.forEach(o => {
              const opt = document.createElement('option');
              opt.value = o; opt.innerText = o;
              optionsSelect.appendChild(opt);
            });
            optionsContainer.style.display = 'block';
          } else {
            optionsSelect.style.display = 'none';
          }

          const getSelectedText = () => {
            const sizeText = (sizeSelect && sizeSelect.style.display !== 'none') ? `\n• المقاس: ${sizeSelect.value}` : '';
            const optText = (optionsSelect && optionsSelect.style.display !== 'none') ? `\n• المواصفات: ${optionsSelect.value}` : '';
            return sizeText + optText;
          };

          // واتساب
          document.getElementById('btn-whatsapp').addEventListener('click', () => {
            const msg = `مرحباً، أريد طلب:\n• المنتج: ${product.name}\n• السعر: ${product.price} ج.م${getSelectedText()}`;
            window.open(`https://wa.me/201111049778?text=${encodeURIComponent(msg)}`, '_blank');
          });

          // ايميل
          document.getElementById('btn-email').addEventListener('click', () => {
            const msg = `مرحباً،\nأريد طلب:\n• المنتج: ${product.name}\n• السعر: ${product.price} ج.م${getSelectedText()}\n\nبرجاء التواصل معي.`;
            window.location.href = `mailto:admin@example.com?subject=طلب منتج: ${encodeURIComponent(product.name)}&body=${encodeURIComponent(msg)}`;
          });

          // إضافة للسلة
          document.getElementById('btn-add-cart').addEventListener('click', async () => {
            const size = (document.getElementById('product-size') && document.getElementById('product-size').style.display !== 'none') ? document.getElementById('product-size').value : 'قياسي';
            const option = (document.getElementById('product-options') && document.getElementById('product-options').style.display !== 'none') ? document.getElementById('product-options').value : 'عادي';

            const productObj = {
              id: productId,
              name: product.name,
              price: product.price,
              image: product.image || 'assets/images/Baner.png',
              size,
              option,
              qty: 1
            };

            const added = await addToCart(productObj);
            if (added) {
              alert('تمت إضافة المنتج إلى السلة بنجاح!');
            }
          });

          loadingElem.style.display = 'none';
          contentElem.style.display = 'grid';
        } else {
          loadingElem.innerHTML = `<h3 style="color:#ff4757;">المنتج غير موجود في قاعدة البيانات! تأكد من أنك لم تقم بحذفه.</h3>`;
        }
      } catch (error) {
        console.error("خطأ في جلب بيانات المنتج: ", error);
        loadingElem.innerHTML = `<h3 style="color:#ff4757;">حدث خطأ أثناء الاتصال بقاعدة البيانات.</h3>`;
      }
    });
  </script>
</body>
</html>
