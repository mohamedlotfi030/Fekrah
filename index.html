<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وكالة فكرة للدعاية والإعلان</title>
    
    <!-- ربط ملف التصميم CSS الخاص بك -->
    <link rel="stylesheet" href="assets/styles/style.css">
    
    <!-- خطوط جوجل (لتحسين شكل النصوص) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* تنسيقات أساسية لضمان ظهور الكروت بشكل سليم حتى لو كان ملف style.css غير مكتمل */
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
        }
        header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .section-title {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
            font-size: 2rem;
        }
        
        /* شبكة عرض المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        
        /* تصميم كارت المنتج الذي سيتم إنشاؤه عبر الجافاسكريبت */
        .product-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            transition: transform 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-image img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .product-category {
            display: inline-block;
            background-color: #e9ecef;
            color: #6c757d;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        .product-title {
            margin: 0 0 10px 0;
            color: #2c3e50;
            font-size: 1.25rem;
        }
        .product-price {
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.4rem;
            margin: 10px 0;
        }
        .btn-order {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-order:hover {
            background-color: #2980b9;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #2c3e50;
            color: white;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- رأس الصفحة -->
    <header>
        <h1>وكالة فكرة للدعاية والإعلان</h1>
        <p>مطبوعات، هدايا دعائية، وخدمات تسويقية متكاملة</p>
    </header>

    <!-- محتوى الصفحة -->
    <main class="container">
        <h2 class="section-title">أحدث خدماتنا</h2>
        
        <!-- الحاوية الأساسية: هنا سيقوم ملف main.js بحقن المنتجات من قاعدة البيانات -->
        <div class="products-grid" id="products-container">
            <!-- رسالة تحميل مبدئية تظهر للزائر حتى يتم جلب البيانات -->
            <p style="text-align:center; grid-column: 1/-1; color: #7f8c8d; font-size: 1.2rem;">
                جاري تحميل المنتجات...
            </p>
        </div>
    </main>

    <!-- ذيل الصفحة -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 لوكالة فكرة</p>
    </footer>

    <!-- استدعاء ملف الجافاسكريبت (نوع module ضروري للتعامل مع Firebase) -->
    <script type="module" src="js/main.js"></script>
    
</body>
</html>
